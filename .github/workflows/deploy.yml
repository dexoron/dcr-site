name: Deploy to GitHub Pages

on:
  push:
    branches: [main, new]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout dcr repo for docs
        uses: actions/checkout@v4
        with:
          repository: dexoron/dcr
          path: ./_dcr

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Sync docs
        run: DCR_REPO=./_dcr bun run sync

      - name: Build
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
