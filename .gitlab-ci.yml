image: oven/bun:latest

cache:
  key:
    files:
      - bun.lockb
  paths:
    - .bun-cache/

pages:
  stage: deploy
  script:
    - bun install --cache-dir .bun-cache
    - bun run build
    - mv build public 
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'