image: node:22

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - npm ci
    - chmod +x scripts/crowdin-pull.sh
    - ./scripts/crowdin-pull.sh || echo "Crowdin pull skipped or failed, using committed translations"
    - npm run check
    - npm run build
  artifacts:
    paths:
      - dist
    expire_in: 1 week

pages:
  stage: deploy
  needs:
    - build
  script:
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
